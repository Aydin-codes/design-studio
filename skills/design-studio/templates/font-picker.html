<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Font picker</title>
<!--
  design-studio font picker. Any browser, any AI tool. Previews load fonts from
  Google Fonts and Fontshare, so they need internet; the list itself works offline.
  Fill in the JSON below: the project's real headline and body text, and Claude's
  suggested pairings (heading font, body font, one line on why). The user can pick a
  suggestion or search the full library (every Google Font plus Fontshare), then
  "Copy choice" pastes it back into the chat.
-->
<script id="board" type="application/json">
{
  "project": "Project name",
  "headline": "Your real headline goes here",
  "body": "A sentence or two of the real body text, so fonts are judged on real words at real sizes.",
  "suggestions": [
    { "heading": "Fraunces", "body": "IBM Plex Sans", "why": "One line on why this fits the product" },
    { "heading": "Archivo", "body": "Newsreader", "why": "" },
    { "heading": "Satoshi", "body": "Satoshi", "why": "" }
  ]
}
</script>
<style>
  :root { --bg:#f6f6f4; --panel:#fff; --ink:#111; --muted:#666; --line:#ddd; --sel:#111; --selink:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --panel:#1a1a1a; --ink:#eee; --muted:#999; --line:#333; --sel:#eee; --selink:#111; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); padding-bottom:230px; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:grid; gap:8px; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=text], textarea { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); }
  .grow { flex:1; min-width:200px; }
  button { font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:5px 12px; border-radius:6px; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--sel); color:var(--selink); border-color:var(--sel); }
  main { padding:12px 16px; }
  .count { color:var(--muted); font-size:13px; }
  .item { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin:10px 0; }
  .meta { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  .meta b { color:var(--ink); font-size:14px; }
  .flag { border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:12px; }
  .prev-h { font-size:34px; line-height:1.1; margin:8px 0 6px; overflow-wrap:anywhere; }
  .prev-b { font-size:16px; line-height:1.5; margin:0; color:var(--ink); max-width:70ch; }
  .actions { margin-left:auto; display:flex; gap:6px; }
  #more { display:block; margin:16px auto; }
  #tray { position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:12px 16px; display:grid; grid-template-columns:1fr 300px; gap:16px; max-height:230px; }
  #tray .live-h { font-size:28px; line-height:1.1; margin:0 0 6px; }
  #tray .live-b { margin:0; font-size:15px; }
  #tray textarea { width:100%; height:64px; }
  #status { font-size:13px; color:var(--muted); min-height:1.2em; }
  @media (max-width:760px) { #tray { grid-template-columns:1fr; max-height:none; position:static; } body { padding-bottom:0; } }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="row">
    <input type="text" id="hText" class="grow" aria-label="Headline text">
    <input type="text" id="bText" class="grow" aria-label="Body text">
  </div>
  <div class="row" role="group" aria-label="View">
    <button data-view="suggested" aria-pressed="true">Suggested</button>
    <button data-view="library" aria-pressed="false">Full library</button>
  </div>
  <div class="row" id="filters" hidden>
    <input type="text" id="q" placeholder="Search fonts" aria-label="Search fonts">
    <span role="group" aria-label="Category" id="cats"></span>
    <span role="group" aria-label="Source" id="srcs"></span>
    <label class="count"><input type="checkbox" id="hideAi"> Hide common AI picks</label>
    <span class="count" id="count"></span>
  </div>
</header>
<main id="list"></main>
<button id="more" hidden>Show more</button>
<div id="tray">
  <div>
    <p class="live-h" id="liveH"></p>
    <p class="live-b" id="liveB"></p>
    <div class="count" id="choice"></div>
  </div>
  <div>
    <textarea id="notes" aria-label="Notes" placeholder="Why you like it, or what's still off"></textarea>
    <div class="row"><button id="copy" aria-pressed="true">Copy choice</button><button id="dl">Download</button></div>
    <div id="status" aria-live="polite"></div>
  </div>
</div>

      const h = byName.get(String(s.heading).toLowerCase()) || { hw:700 }, b = byName.get(String(s.body).toLowerCase()) || { pw:400 };
      return `<div class="item"><div class="meta"><b>${i+1}. ${esc(s.heading)} + ${esc(s.body)}</b><span>${esc(s.why||"")}</span>
        <span class="actions"><button data-pair="${i}">Use this pair</button></span></div>
        <p class="prev-h" style="font-family:${esc(fam(s.heading))};font-weight:${h.hw}">${esc(st.h)}</p>
        <p class="prev-b" style="font-family:${esc(fam(s.body))};font-weight:${b.pw}">${esc(st.b)}</p></div>`;
    }).join("") + `<p class="count">Not it? Open the full library: every Google Font and the Fontshare collection.</p>`;
    return;
  }
  if (!keep) shown = 60;
  const all = filtered();
  $("count").textContent = all.length + " fonts";
  L.innerHTML = all.slice(0, shown).map(x => row(x)).join("");
  $("more").hidden = shown >= all.length;
  if (io) L.querySelectorAll(".item").forEach(el => io.observe(el)); else all.slice(0, shown).forEach(x => load(x.f));
}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.view) { view = b.dataset.view; document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", x === b)); $("filters").hidden = view !== "library"; render(); }
  else if (b.dataset.role) choose(b.dataset.role, b.dataset.f);
  else if (b.dataset.pair !== undefined) { const s = board.suggestions[+b.dataset.pair]; st.heading = s.heading; st.body = s.body; save(); tray(); }
  else if (b.dataset.cat !== undefined) { cat = b.dataset.cat; document.querySelectorAll("[data-cat]").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); }
  else if (b.dataset.src !== undefined) { src = b.dataset.src; document.querySelectorAll("[data-src]").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); }
});
$("cats").innerHTML = [["","All"],...Object.entries(CAT)].map(([k,v]) => `<button data-cat="${k}" aria-pressed="${k===""}">${v}</button>`).join("");
$("srcs").innerHTML = [["","All sources"],["Google","Google"],["Fontshare","Fontshare"]].map(([k,v]) => `<button data-src="${k}" aria-pressed="${k===""}">${v}</button>`).join("");
$("q").oninput = () => render(); $("hideAi").onchange = () => render();
$("more").onclick = () => { shown += 60; render(true); };
function feedback() {
  const lic = n => { const x = byName.get(String(n).toLowerCase()); return x ? (x.src === "Google" ? "Google Fonts, open licence" : "Fontshare, free for personal and commercial use") : "not in the list"; };
  return `# Font choice: ${board.project}\n\n- Headings: ${st.heading || "not chosen"}${st.heading ? " (" + lic(st.heading) + ")" : ""}\n- Body: ${st.body || "not chosen"}${st.body ? " (" + lic(st.body) + ")" : ""}\n${st.notes.trim() ? "\n## Notes\n" + st.notes.trim() + "\n" : ""}`;
}
$("copy").onclick = async () => {
  const t = feedback();
  try { await navigator.clipboard.writeText(t); } catch { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
  $("status").textContent = "Copied. Paste it into the chat.";
};
$("dl").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([feedback()], { type:"text/markdown" })); a.download = "font-choice.md"; a.click(); $("status").textContent = "Saved as font-choice.md."; };
render(); tray();
</script>
</body>
</html>
